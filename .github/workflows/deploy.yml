name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, mais on ne coupe jamais celui qui est en vol :
# deploy-pages a déjà créé le déploiement Pages quand l'annulation arrive, et il
# reste alors un déploiement orphelin qui finit en erreur. Pages traitant ses
# déploiements en série, l'erreur bloque le suivant — une série de pushes
# rapprochés suffisait à laisser le site en ligne plusieurs versions en retard.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
